name: CI Pipeline


on:
  push:
  pull_request:

jobs:

  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy
      
      - name: Run flake8 (style guide)
        run: |
          flake8 *.py --count --max-complexity=10 --max-line-length=127 --statistics
          flake8 src/ --count --max-complexity=10 --max-line-length=127 --statistics || true
      
      - name: Run black (formatting)
        run: black --check --diff *.py src/ || true
      
      - name: Run isort (imports order)
        run: isort --check-only *.py src/ || true
      
      - name: Run mypy (type checking)
        run: mypy *.py src/ --ignore-missing-imports || true


  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint  
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest pytest-asyncio pytest-cov
      
      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=. --cov-report=term --cov-report=xml
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
