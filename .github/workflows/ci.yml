name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy pylint bandit safety
      
      - name: Run flake8 (style guide)
        run: |
          flake8 app/ --count --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Run black (formatting)
        run: black --check --diff app/
      
      - name: Run isort (imports order)
        run: isort --check-only --profile=black app/
      
      - name: Run mypy (type checking)
        run: mypy app/ --ignore-missing-imports
      
      - name: Run pylint (code quality)
        run: pylint app/ --fail-under=8.0 --exit-zero || true
      
      - name: Run bandit (security)
        run: bandit -r app/ -f json -o bandit-report.json || true
      
      - name: Run safety (dependencies)
        run: safety check || true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest pytest-asyncio pytest-cov httpx anyio
      
      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=app --cov-report=term --cov-report=xml
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
