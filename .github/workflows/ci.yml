name: CI Pipeline


on:
  push:
  pull_request:

jobs:

  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy
      
      - name: Run flake8 (style guide)
        run: |
          flake8 *.py --count --max-complexity=10 --max-line-length=127 --statistics
          flake8 src/ --count --max-complexity=10 --max-line-length=127 --statistics || true
      
      - name: Run black (formatting)
        run: black --check --diff *.py src/ || true
      
      - name: Run isort (imports order)
        run: isort --check-only *.py src/ || true
      
      - name: Run mypy (type checking)
        run: mypy *.py src/ --ignore-missing-imports || true
